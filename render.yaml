# Render Blueprint — one service, one container.
# Create it from the Render dashboard: New > Blueprint, point at this repo.
services:
  - type: web
    name: vqe-explorer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Measured under a hard 512 MB cap: steady state ~330 MB after exercising
    # every scenario. That headroom depends on the shared fake-backend
    # simulators in vqe_app/scenarios.py — without them this OOM-kills, which
    # test_app.py guards against.
    # Prefer this over the free plan, which spins down when idle. The app's own
    # wake cost is small (~1s to import, ~0.7s to build a fake backend); what
    # you actually wait for is the platform re-provisioning the container.
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      # sync: false means Render prompts at deploy time, so the password never
      # lands in git and the service cannot go live unprotected by accident.
      - key: APP_PASSWORD
        sync: false

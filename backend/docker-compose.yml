# Self-hosted alternative to Render (same image, same behaviour).
# Run from the repo root:
#   docker compose --env-file backend/.env -f backend/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_USERNAME: ${AUTH_USERNAME:?set AUTH_USERNAME in backend/.env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?set AUTH_PASSWORD in backend/.env}
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in backend/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

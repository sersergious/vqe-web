# Local testing — runs the production image exactly as it will on Render.
#
#   docker compose up --build                        → http://localhost:8501
#   APP_PASSWORD=secret docker compose up --build     → with a password gate
services:
  app:
    container_name: vqe-local
    build:
      context: .
    ports:
      # HOST_PORT=8502 docker compose up   if something already holds 8501.
      - "${HOST_PORT:-8501}:8501"
    environment:
      # Empty by default: the app runs open and says so in the sidebar.
      APP_PASSWORD: ${APP_PASSWORD:-}
    # Mirrors Render's starter plan so a memory regression fails here rather
    # than in production. See the performance notes in README.md.
    mem_limit: 512m
